name: Build Release AAB & APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 21 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies & Build Web Assets
        run: |
          npm ci || npm install
          npm run build
          cp -r www/* android/app/src/main/assets/public/

      - name: Grant Execute Permissions for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android App Bundle (.aab) for Google Play
        run: |
          cd android
          ./gradlew bundleRelease

      - name: Build Android APK (.apk) for Direct Download / Testing
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Upload Release AAB (Google Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: match-a-doodle-google-play-bundle
          path: android/app/build/outputs/bundle/release/*.aab

      - name: Upload Release APK (Direct Install)
        uses: actions/upload-artifact@v4
        with:
          name: match-a-doodle-release-apk
          path: android/app/build/outputs/apk/release/*.apk
