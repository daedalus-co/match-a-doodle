name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          ls -la "$ANDROID_HOME/platforms" || true

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Copy and prepare APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk match-a-doodle.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: match-a-doodle-apk
          path: match-a-doodle.apk

      - name: Create or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.0.0 --yes || true
          gh release create v1.0.0 match-a-doodle.apk \
            --title "Match-a-Doodle v1.0.0 (Android APK)" \
            --notes "Direct installable APK for Android devices. Download and tap to install directly on your phone."
